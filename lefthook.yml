pre-commit:
  parallel: false
  commands:
    lint:
      glob: "*.{js,jsx,ts,tsx}"
      exclude: "{tests,scripts}/**"
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
    format:
      glob: "*.{js,jsx,ts,tsx,css}"
      run: pnpm exec oxfmt --write {staged_files}
      stage_fixed: true
    modularity:
      glob: "*.{js,jsx,ts,tsx}"
      run: node scripts/check-modularity.js {staged_files}

pre-push:
  commands:
    typecheck:
      run: pnpm exec tsc --noEmit --incremental --checkers 4
    test:
      run: pnpm test:coverage
    i18n_unused:
      run: pnpm check:i18n:unused
