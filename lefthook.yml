pre-commit:
  parallel: false
  commands:
    lint:
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
    format:
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm exec oxfmt --write {staged_files}
      stage_fixed: true
    modularity:
      glob: "*.{js,jsx,ts,tsx}"
      run: node scripts/check-modularity.js {staged_files}

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm vitest run --coverage
